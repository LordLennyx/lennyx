name: Build Lennyx (Windows .exe + Android .apk)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# ⚠ La publication de la PWA vit dans pages.yml, pas ici : deux workflows qui
# déploient sur GitHub Pages se disputent le même environnement et l'un des
# deux échoue systématiquement.

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # gen:icon AVANT build : il produit les icônes et réécrit les balises
      # d'écran de lancement dans index.html. Lancé après, son travail ne
      # serait pas dans le bundle.
      - run: npm run gen:icon
      - run: npm run build
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Lennyx-Windows-Setup
          path: release/*.exe

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run gen:icon
      - run: npm run build
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Lennyx-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
