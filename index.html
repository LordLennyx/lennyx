    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Lennyx</title>
    <meta name="description" content="La to-do list gamifiée : quêtes, XP, streaks, or et gloire." />

    <!-- Monogramme « L » en SVG : net à toutes les tailles, et fidèle à
         l'iconographie maison (aucun emoji dans Lennyx, c'est un choix). -->
    <link rel="icon" type="image/svg+xml" href="./icons/monogram.svg" />
    <link rel="alternate icon" href="./icons/icon-192.png" />
    <link rel="mask-icon" href="./icons/monogram.svg" color="#d4af37" />

    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0a0a0d" />

    <!-- ── Apple ────────────────────────────────────────────────────────
         Safari ignore une partie du manifeste : sans ces balises, « Ajouter
         au Dock » (macOS) et « Sur l'écran d'accueil » (iOS) donnent une
         vignette de page web au lieu d'une application. -->
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lennyx" />
    <!-- black-translucent : le fond de l'app passe SOUS la barre d'état, d'où
         les marges env(safe-area-inset-*) dans la feuille de style. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
